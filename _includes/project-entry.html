<article class="project-entry">
  {% if project.image %}<a href="{{ project.url | relative_url }}" tabindex="-1" aria-hidden="true"><img class="project-image" src="{{ project.image | relative_url }}" alt="" loading="lazy"></a>{% endif %}
  <h3><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h3>
  <p class="project-period">{{ project.period }}</p>
  <p>{{ project.summary }}</p>
</article>
