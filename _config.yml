# Academic Pages / Jekyll. A GitHub user site needs an empty baseurl.
locale: en-US
title: Eunji Woo
name: Eunji Woo
title_separator: ·
description: Eunji Woo — design researcher working with local communities, service
  experiences, and bottom-up innovation.
url: https://ooungy.github.io
baseurl: ''
repository: ooungy/ooungy.github.io
site_theme: default
timezone: Asia/Seoul
author:
  name: Eunji Woo
  bio: Design researcher · Community design
  location: Daejeon, Republic of Korea
  employer: KAIST
  email: eunji.woo@kaist.ac.kr
  linkedin: ooungy
social:
  type: Person
  name: Eunji Woo
  links:
  - https://www.linkedin.com/in/ooungy/
atom_feed:
  hide: true
comments:
  provider: false
analytics:
  provider: false
include:
- _pages
exclude:
- preview
- README.md
- CONTRIBUTING.md
- LICENSE
- Dockerfile
- docker-compose.yaml
- Gemfile
- Gemfile.lock
- package.json
- package-lock.json
- node_modules
- vendor
- .bundle
- .github
- .sass-cache
- .jekyll-cache
- local
- scripts
- markdown_generator
- talkmap
- talkmap.py
- talkmap.ipynb
- talkmap_out.ipynb
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
collections:
  publications:
    output: true
    permalink: /publications/:path/
  portfolio:
    output: true
    permalink: /projects/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  talks:
    output: false
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: academic
    author_profile: false
- scope:
    path: ''
    type: publications
  values:
    layout: publication
    author_profile: false
- scope:
    path: ''
    type: portfolio
  values:
    layout: project
    author_profile: false
- scope:
    path: ''
    type: teaching
  values:
    layout: academic
    author_profile: false
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
plugins:
- jekyll-feed
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
whitelist:
- jekyll-feed
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
