---
layout: default
---
<main id="main" class="academic-main{% if page.home %} academic-main--home{% endif %}" tabindex="-1">
  {% unless page.home %}
  <header class="page-heading">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-intro">{{ page.description }}</p>{% endif %}
  </header>
  {% endunless %}
  {{ content }}
</main>
