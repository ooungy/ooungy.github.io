---
layout: academic
---
<article class="detail-content">
  <p class="project-meta">{{ page.period }}{% if page.role %} · {{ page.role }}{% endif %}</p>
  {% if page.image %}<figure><img class="project-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | escape }}">{% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}</figure>{% endif %}
  {{ content }}
  {% for image in page.gallery %}
  <figure><img class="project-image" src="{{ image.path | relative_url }}" alt="{{ image.alt | escape }}" loading="lazy">{% if image.caption %}<figcaption>{{ image.caption }}</figcaption>{% endif %}</figure>
  {% endfor %}
  <p class="back-link"><a href="{{ '/projects/' | relative_url }}">← All projects</a></p>
</article>
